<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Natale a Garlasco · 19 dicembre 2026</title>
<meta name="description" content="Invito alla festa di Natale a Garlasco, sabato 19 dicembre 2026. Rally in macchina nell'Oltrepò al mattino, cena la sera.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12372A">

<!-- anteprima quando incolli il link in WhatsApp -->
<meta property="og:type" content="website">
<meta property="og:title" content="Natale a Garlasco">
<meta property="og:description" content="Sabato 19 dicembre 2026. Prima di entrare devi dirmi chi sei.">
<meta property="og:image" content="https://rikyhasa.github.io/natale-garlasco/anteprima.png">
<meta property="og:url" content="https://rikyhasa.github.io/natale-garlasco/">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:,">
<link rel="preload" href="assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="stile.css?v=13">
</head>
<body class="neve-on">
<canvas id="cfx" aria-hidden="true"></canvas>
<div id="neve" aria-hidden="true"></div>

<main id="app">

  <!-- 1 · TU CHI SEI -->
  <section class="pg" id="p-chi" data-pg="chi" aria-labelledby="chiT">
    <div class="centro">
      <p class="adesivo" data-t="chi.sopra"></p>
      <h1 class="gigante" id="chiT" data-t="chi.titolo"></h1>
      <p class="sotto" data-t="chi.sotto"></p>
      <p class="et" data-t="chi.scegli"></p>
      <div class="nomi" id="nomi"></div>
      <button type="button" class="link" id="fuoriLista" data-t="chi.fuoriLista"></button>
      <p class="battuta" id="fuoriRisp" hidden data-t="chi.fuoriListaRisposta"></p>
      <p class="battuta" id="ritorno" hidden aria-live="polite"></p>
    </div>
  </section>

  <!-- 2 · SICURO SICURO -->
  <section class="pg" id="p-sicuro" data-pg="sicuro" aria-labelledby="sTit">
    <div class="centro" id="sicuroBox">
      <h1 class="grande" id="sTit"></h1>
      <p class="sotto" data-t="sicuro.sotto"></p>
      <div class="arena" id="arena">
        <div class="slot" id="slotSi"><button type="button" class="btn verde" id="si" data-t="sicuro.si"></button></div>
        <button type="button" class="btn chiaro" id="no" data-t="sicuro.no"></button>
      </div>
      <p class="presa" id="presa" aria-live="polite"></p>
    </div>
    <div class="centro rivela" id="rivela" hidden>
      <p class="dopo" id="rvDopo" data-t="sicuro.dopo"></p>
      <div class="timbro" id="rvTit">
        <h1 id="rvH"></h1>
        <p id="rvD"></p>
      </div>
      <button type="button" class="btn oro" id="apri" data-t="sicuro.apri"></button>
    </div>
  </section>

  <!-- 3 · L'INVITO -->
  <section class="pg" id="p-invito" data-pg="invito" aria-label="Invito">
    <div class="colonna">
      <div class="topbar">
        <span><span data-t="invito.per"></span> <strong id="whoName"></strong></span>
        <button type="button" class="link" id="nonSei" data-t="invito.nonSei"></button>
      </div>

      <header class="hero">
        <div class="pettorale" aria-hidden="true"><span>19</span><small>dic</small></div>
        <p class="adesivo" id="tier"></p>
        <h1 class="gigante" id="heroT"></h1>
        <p class="data" id="heroD"></p>
        <p class="sotto" id="lede"></p>
        <dl class="fatti" id="fatti"></dl>
      </header>

      <div class="foglio">
      <section class="blk" id="rally" hidden>
        <p class="et" data-t="invito.rallyEt"></p>
        <h2 data-t="invito.rallyTitolo"></h2>
        <p class="intro" id="rallyIntro"></p>

        <div class="mappa-box" id="mappaBox">
          <div class="mappa-scena" id="mScena">
            <div class="pins" id="pins"></div>
            <div class="mappa-top">
              <span class="orologio" id="orologio">09:15</span>
              <span class="esagero" id="esagero"></span>
            </div>
            <p class="mappa-hint" id="mHint" data-t="invito.mappaHint"></p>
            <p class="mappa-nogl" id="noGl" hidden data-t="invito.noGl"></p>
          </div>
          <div class="mappa-bar" id="mBar">
            <button type="button" class="btn picc verde" id="bGuida"></button>
            <button type="button" class="btn picc chiaro" id="bMuovi"></button>
            <button type="button" class="btn picc chiaro" id="bAlto" data-t="invito.mappaAlto"></button>
          </div>
          <canvas class="profilo" id="profilo" aria-label="Profilo altimetrico del percorso"></canvas>
          <p class="didascalia" data-t="invito.profilo"></p>
        </div>

        <div class="dett carta" id="dett" aria-live="polite"></div>

        <h3 class="et2" data-t="invito.tappeTitolo"></h3>
        <ol class="tappe" id="lista"></ol>

        <div class="btnrow"><a class="btn chiaro" id="gmaps" target="_blank" rel="noopener" data-t="invito.maps"></a></div>
        <p class="nota-regole" data-t="invito.regole"></p>

        <div class="fine-rally carta" data-rv>
          <h3 data-t="invito.rallyFineTit"></h3>
          <p id="rallyFine"></p>
        </div>
      </section>

      <section class="blk" id="cena">
        <p class="et" data-t="invito.cenaEt"></p>
        <h2 data-t="invito.cenaTitolo"></h2>
        <p class="intro" id="cenaIntro"></p>
        <ol class="scaletta" id="scaletta"></ol>
      </section>

      <div class="fondo"><button type="button" class="btn grande-btn" id="vaiRisposta" data-t="invito.avanti"></button></div>
      </div>
    </div>
  </section>

  <!-- 4 · VIENI O NO -->
  <section class="pg" id="p-risposta" data-pg="risposta" aria-labelledby="rT">
    <div class="colonna">
      <h1 class="grande" id="rT" data-t="risposta.titolo"></h1>
      <div class="scelta">
        <button type="button" class="btn verde grande-btn" id="vSi" aria-pressed="false" data-t="risposta.si"></button>
        <button type="button" class="btn chiaro grande-btn" id="vNo" aria-pressed="false" data-t="risposta.no"></button>
      </div>

      <div class="sub" id="rallyQ" hidden>
        <p class="dom" data-t="risposta.rallyQ"></p>
        <div class="scelta">
          <button type="button" class="btn verde" id="rSi" aria-pressed="false" data-t="risposta.rallySi"></button>
          <button type="button" class="btn chiaro" id="rNo" aria-pressed="false" data-t="risposta.rallyNo"></button>
        </div>
      </div>

      <label class="campo" id="notaFld" hidden>
        <span class="dom" data-t="risposta.notaTit"></span>
        <span class="hint" data-t="risposta.notaHint"></span>
        <textarea id="nota" rows="3" maxlength="400" data-ph="risposta.notaPh"></textarea>
      </label>

      <div class="invio carta" id="invio" hidden>
        <p class="dom" data-t="risposta.msgTit"></p>
        <div class="anteprima" id="anteprima"></div>
        <div class="btnrow" id="invioBtns">
          <a class="btn verde" id="wa" target="_blank" rel="noopener" hidden data-t="risposta.msgWa"></a>
          <button type="button" class="btn chiaro" id="copia" data-t="risposta.msgCopia"></button>
        </div>
        <p class="toast" id="toast" aria-live="polite"></p>
        <p class="hint" data-t="risposta.msgNota"></p>
      </div>

      <p class="battuta" id="peccato" hidden data-t="risposta.peccato"></p>
      <div class="fondo"><button type="button" class="btn grande-btn" id="vaiBabbo" hidden data-t="risposta.avanti"></button></div>
    </div>
  </section>

  <!-- 5 · BABBO NATALE SEGRETO -->
  <section class="pg" id="p-babbo" data-pg="babbo" aria-labelledby="bT">
    <div class="centro intro-babbo" id="introBabbo" hidden aria-live="polite">
      <p class="ib-su" id="ibSu"></p>
      <div class="timbro ib-titolo" id="ibTit"><h1 data-t="babbo.titolo"></h1><p>obbligatorio</p></div>
      <button type="button" class="btn oro grande-btn" id="ibVai" data-t="babbo.introVai"></button>
    </div>
    <div class="colonna" id="babboCorpo">
      <p class="adesivo ros">obbligatorio</p>
      <h1 class="grande" id="bT" data-t="babbo.titolo"></h1>
      <p class="intro" data-t="babbo.testo"></p>
      <p class="tetto" data-t="babbo.tetto"></p>
      <ol class="regole" id="regole"></ol>

      <div class="ruota-box" id="ruotaBox">
        <div class="ptr" id="ptr" aria-hidden="true"></div>
        <svg id="ruota" viewBox="0 0 320 320" role="img" aria-label="Ruota con i nomi degli invitati"></svg>
      </div>
      <div class="btnrow centra"><button type="button" class="btn oro grande-btn" id="estrai" data-t="babbo.estrai"></button></div>

      <div class="risultato carta" id="risultato" hidden aria-live="polite">
        <p class="et" data-t="babbo.risultato"></p>
        <p class="nome-gigante" id="bersaglio"></p>
        <p class="hint" data-t="babbo.sotto"></p>
        <button type="button" class="link" id="rigira" data-t="babbo.rigira"></button>
      </div>
      <p class="battuta" id="chiusuraBabbo" hidden data-t="babbo.chiusura"></p>
      <div class="fondo"><button type="button" class="btn grande-btn" id="vaiQuota" hidden data-t="babbo.avanti"></button></div>
    </div>
  </section>

  <!-- 6 · LA QUOTA -->
  <section class="pg" id="p-quota" data-pg="quota" aria-labelledby="qT">
    <div class="centro">
      <h1 class="grande" id="qT" data-t="quota.titolo"></h1>
      <p class="intro" data-t="quota.testo"></p>
      <div class="btnrow centra">
        <a class="btn oro grande-btn" id="paga" target="_blank" rel="noopener" hidden></a>
        <p class="battuta" id="pagaDopo" hidden data-t="quota.inArrivo"></p>
      </div>
      <p class="hint" data-t="quota.oppure"></p>
      <p class="fine" data-t="quota.fine"></p>
      <button type="button" class="link" id="riapri" data-t="quota.riapri"></button>
    </div>
  </section>

</main>
<footer id="piede"></footer>

<noscript><p style="padding:24px;font:16px sans-serif">Per aprire l'invito serve JavaScript. Scrivi a Riccardo se non funziona.</p></noscript>
<script src="config.js?v=13"></script>
<script src="assets/codec.js?v=13"></script>
<script src="sorteggio.js?v=13"></script>
<script src="app.js?v=13"></script>
</body>
</html>
